<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NIVORA ORDERS</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      background: #f3f6fb;
      color: #111827;
    }

    .hidden {
      display: none !important;
    }

    /* Login Screen */
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      border: 1px solid #e5e7eb;
    }

    .brand-badge {
      display: inline-block;
      background: #eef2ff;
      color: #1d4ed8;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.6px;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .login-card h1 {
      margin: 0 0 6px;
      font-size: 24px;
    }

    .login-card p {
      margin: 0 0 20px;
      color: #4b5563;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #374151;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      background: #fff;
      color: #111827;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #1d4ed8;
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.12);
    }

    .btn {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #1d4ed8;
      color: #ffffff;
    }

    .btn-secondary {
      background: #0f766e;
      color: #ffffff;
    }

    .btn-logout {
      width: auto;
      padding: 8px 14px;
      font-size: 13px;
      background: #fee2e2;
      color: #b91c1c;
      border-radius: 8px;
    }

    .error-text {
      margin-top: 12px;
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
    }

    /* Main App */
    .topbar {
      background: #1e3a8a;
      color: #ffffff;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar-title {
      font-size: 18px;
      font-weight: 700;
      margin: 0;
    }

    .topbar-sub {
      font-size: 12px;
      color: #dbeafe;
      margin-top: 2px;
      word-break: break-all;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 18px 16px 40px;
    }

    .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 17px;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .order-item {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
      background: #f9fafb;
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .order-meta {
      font-size: 12px;
      color: #6b7280;
    }

    .muted {
      color: #6b7280;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="login-wrapper">
    <div class="login-card">
      <div class="brand-badge">AUTHORIZED SHOP ACCESS</div>
      <h1>NIVORA ORDERS</h1>
      <p>Sign in with your approved shop owner account to access orders.</p>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" placeholder="owner@shop.com" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" placeholder="Enter password" required autocomplete="current-password" />
        </div>

        <button id="login-btn" type="submit" class="btn btn-primary">Log In</button>
        <div id="login-error" class="error-text hidden"></div>
      </form>
    </div>
  </div>

  <!-- PROTECTED APP SCREEN -->
  <div id="app-screen" class="hidden">
    <header class="topbar">
      <div>
        <h1 class="topbar-title">NIVORA ORDERS</h1>
        <div id="user-email-display" class="topbar-sub"></div>
      </div>
      <button id="logout-btn" type="button" class="btn btn-logout">Log Out</button>
    </header>

    <main class="container">
      <section class="card">
        <h2>Quick Order Entry</h2>
        <form id="order-form">
          <div class="form-group">
            <label for="customer-name">Customer / WhatsApp Reference</label>
            <input id="customer-name" type="text" placeholder="e.g., Ramesh / WhatsApp Voice" required />
          </div>

          <div class="row-2">
            <div class="form-group">
              <label for="order-qty">Quantity</label>
              <input id="order-qty" type="number" min="1" value="1" required />
            </div>
            <div class="form-group">
              <label for="order-rate">Rate per Item (₹)</label>
              <input id="order-rate" type="number" min="0" step="0.01" placeholder="0" required />
            </div>
          </div>

          <div class="form-group">
            <label for="order-notes">Items / Voice Notes</label>
            <textarea id="order-notes" rows="3" placeholder="Speak or paste customer order details..." required></textarea>
          </div>

          <button type="submit" class="btn btn-secondary">Save Order</button>
        </form>
      </section>

      <section class="card">
        <h2>Saved Orders</h2>
        <div id="orders-list" class="muted">No orders saved yet.</div>
      </section>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-analytics.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD553vHEjV6-Owme9jzHbNTUV9hY1j2vpI",
      authDomain: "nivora-orders.firebaseapp.com",
      projectId: "nivora-orders",
      storageBucket: "nivora-orders.firebasestorage.app",
      messagingSenderId: "580605150647",
      appId: "1:580605150647:web:3d81e1c59f956059c0d432",
      measurementId: "G-62QRTCNV1B"
    };

    const app = initializeApp(firebaseConfig);
    try {
      getAnalytics(app);
    } catch (_) {
      // Ignore analytics errors in restricted browsers
    }

    const auth = getAuth(app);

    const loginScreen = document.getElementById("login-screen");
    const appScreen = document.getElementById("app-screen");
    const loginForm = document.getElementById("login-form");
    const loginEmail = document.getElementById("login-email");
    const loginPassword = document.getElementById("login-password");
    const loginBtn = document.getElementById("login-btn");
    const loginError = document.getElementById("login-error");
    const userEmailDisplay = document.getElementById("user-email-display");
    const logoutBtn = document.getElementById("logout-btn");

    const orderForm = document.getElementById("order-form");
    const customerName = document.getElementById("customer-name");
    const orderQty = document.getElementById("order-qty");
    const orderRate = document.getElementById("order-rate");
    const orderNotes = document.getElementById("order-notes");
    const ordersList = document.getElementById("orders-list");

    function showError(message) {
      loginError.textContent = message;
      loginError.classList.remove("hidden");
    }

    function clearError() {
      loginError.textContent = "";
      loginError.classList.add("hidden");
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function getOrdersKey(uid) {
      return `nivora_orders_${uid}`;
    }

    function renderOrders(uid) {
      const raw = localStorage.getItem(getOrdersKey(uid));
      const orders = raw ? JSON.parse(raw) : [];

      if (!orders.length) {
        ordersList.innerHTML = '<div class="muted">No orders saved yet.</div>';
        return;
      }

      ordersList.innerHTML = orders
        .map((order) => {
          const total = (Number(order.qty) * Number(order.rate)).toFixed(2);
          return `
            <div class="order-item">
              <div class="order-top">
                <span>${escapeHtml(order.customer)}</span>
                <span>₹${total}</span>
              </div>
              <div>${escapeHtml(order.notes)}</div>
              <div class="order-meta">Qty: ${order.qty} × ₹${Number(order.rate).toFixed(2)} • ${escapeHtml(order.time)}</div>
            </div>
          `;
        })
        .join("");
    }

    onAuthStateChanged(auth, (user) => {
      if (user) {
        clearError();
        loginScreen.classList.add("hidden");
        appScreen.classList.remove("hidden");
        userEmailDisplay.textContent = user.email || "Authorized Shop Owner";
        renderOrders(user.uid);
      } else {
        appScreen.classList.add("hidden");
        loginScreen.classList.remove("hidden");
        ordersList.innerHTML = '<div class="muted">No orders saved yet.</div>';
      }
    });

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearError();

      const email = loginEmail.value.trim();
      const password = loginPassword.value;

      loginBtn.disabled = true;
      loginBtn.textContent = "Signing in...";

      try {
        await signInWithEmailAndPassword(auth, email, password);
        loginForm.reset();
      } catch (err) {
        if (
          err.code === "auth/invalid-credential" ||
          err.code === "auth/user-not-found" ||
          err.code === "auth/wrong-password"
        ) {
          showError("Invalid email or password. Only approved shop accounts can log in.");
        } else if (err.code === "auth/too-many-requests") {
          showError("Too many failed attempts. Please wait a moment and try again.");
        } else {
          showError("Login failed. Please check your connection and credentials.");
        }
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = "Log In";
      }
    });

    logoutBtn.addEventListener("click", async () => {
      try {
        await signOut(auth);
      } catch (_) {
        alert("Could not log out. Please try again.");
      }
    });

    orderForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const currentUser = auth.currentUser;
      if (!currentUser) return;

      const qty = Number(orderQty.value);
      const rate = Number(orderRate.value);
      const newOrder = {
        customer: customerName.value.trim(),
        qty,
        rate,
        notes: orderNotes.value.trim(),
        time: new Date().toLocaleString()
      };

      const key = getOrdersKey(currentUser.uid);
      const existing = JSON.parse(localStorage.getItem(key) || "[]");
      existing.unshift(newOrder);
      localStorage.setItem(key, JSON.stringify(existing));

      orderForm.reset();
      orderQty.value = "1";
      renderOrders(currentUser.uid);
    });
  </script>
</body>
</html>
